name: Web CI

on:
    push:
        branches:
            - main
        paths:
            - "web/**"
            - ".github/workflows/web-ci.yml"
    pull_request:
        paths:
            - "web/**"
            - ".github/workflows/web-ci.yml"

permissions:
    contents: read

concurrency:
    group: web-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        working-directory: web

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.24.0
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting with Biome
              run: pnpm format:check

            - name: Lint with Biome
              run: pnpm lint:biome

            - name: Lint Next.js
              run: pnpm lint

            - name: Check FSD boundaries
              run: pnpm steiger

            - name: Build
              run: pnpm build

    deploy:
        name: Deploy production
        needs: checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment:
            name: Production
            url: ${{ steps.deploy.outputs.url }}
        env:
            VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.24.0
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - name: Install Vercel CLI
              run: npm install --global vercel@50.43.0

            - name: Pull Vercel production settings
              working-directory: .
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: vercel pull --yes --environment=production

            - name: Build Vercel production output
              working-directory: .
              run: vercel build --prod

            - name: Deploy Vercel production output
              id: deploy
              working-directory: .
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  deployment_url="$(vercel deploy --yes --prebuilt --prod)"
                  echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
