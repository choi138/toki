name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Codex review label automation
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Set up Node.js for review-loop hook tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Codex review loop
        run: python3 -m unittest discover -s .agents/skills/codex-review-loop/tests -p "test_*.py"

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling (XcodeGen, SwiftLint, SwiftFormat)
        run: brew install xcodegen swiftlint swiftformat

      - name: SwiftFormat
        # The pre-stack baseline predates this SwiftFormat 0.62 default rule.
        run: swiftformat . --lint --disable wrapIfStatementBodies

      - name: SwiftLint
        run: swiftlint lint --strict --quiet

      - name: Run protocol and Agent tests
        run: swift test --package-path core

      - name: Build macOS Agent
        run: swift build --package-path core -c release --product toki-agent

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: menubar

      - name: Build
        working-directory: menubar
        run: |
          xcodebuild build \
            -project Toki.xcodeproj \
            -scheme Toki \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        working-directory: menubar
        run: |
          xcodebuild test \
            -project Toki.xcodeproj \
            -scheme Toki \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify package lockfiles are unchanged
        run: >-
          git diff --exit-code --
          core/Package.resolved
          hub/Package.resolved
          menubar/Toki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  remote-linux-agent:
    name: Linux Agent (Swift 5.9.2)
    runs-on: ubuntu-24.04
    container: swift:5.9.2-jammy
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Snapshot package lockfile
        run: cp core/Package.resolved "$RUNNER_TEMP/toki-agent-Package.resolved"

      - name: Install SQLite development headers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y libsqlite3-dev

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 5.9.2"

      - name: Run protocol and Agent tests
        run: swift test --package-path core

      - name: Build Linux Agent
        run: swift build --package-path core -c release --product toki-agent

      - name: Verify package lockfiles are unchanged
        run: diff -u "$RUNNER_TEMP/toki-agent-Package.resolved" core/Package.resolved

  remote-linux-hub:
    name: Linux Hub (Swift 6.2.4)
    runs-on: ubuntu-24.04
    # The patched SwiftNIO releases all declare swift-tools-version 6.1, so
    # Swift 5.9.2 silently resolves the Hub back to the vulnerable versions.
    container: swift:6.2.4-noble
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Snapshot package lockfile
        run: cp hub/Package.resolved "$RUNNER_TEMP/toki-hub-Package.resolved"

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2.4"

      - name: Run Hub tests
        run: swift test --package-path hub

      - name: Build Linux Hub
        run: swift build --package-path hub -c release --product toki-hub

      - name: Verify package lockfiles are unchanged
        run: diff -u "$RUNNER_TEMP/toki-hub-Package.resolved" hub/Package.resolved
